<!DOCTYPE html>
<html lang="en" data-base="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Full Gallery — Tanveer Naidu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=Anton&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
/* ============================================================
   FULL GALLERY — helix spiral scroll
   Every photograph on the site arranged on a 3D spiral. Scroll
   turns the spiral; the front frame's name + scene fade in on
   the left. Industrial-editorial: warm dark mono + terracotta.
   ============================================================ */
html, body { background: var(--dark-bg); color: var(--dark-ink); }
html { scroll-behavior: auto; }

/* 3D mode (JS adds .sg-3d): virtual infinite scroll — no native scrollbar */
body.sg-3d { overflow: hidden; height: 100svh; }
body.sg-3d .sg-stage { touch-action: none; }

/* faint grid — gives the dark space depth, like graph paper in a studio */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 90px 90px;
}

.sg-nav {
  position: fixed; inset: 0 0 auto 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px var(--edge);
  mix-blend-mode: difference; color: #fff;
}
.sg-nav a { color: #fff; text-decoration: none; }
.sg-back {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
  text-transform: uppercase;
}
.sg-back .arr { display: inline-block; transition: transform 0.25s var(--ease); }
.sg-back:hover .arr { transform: translateX(-4px); }
.sg-brand { font-family: var(--font-display); font-weight: 900; font-size: 15px; letter-spacing: 0.01em; }
.sg-brand sup { font-size: 8px; }
.sg-count {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
}
.sg-count b { font-weight: 700; }

/* ---- Fixed 3D stage ---------------------------------------- */
.sg-stage {
  position: fixed; inset: 0; overflow: hidden;
  perspective: 1900px; perspective-origin: 50% 46%;
}
.sg-world {
  position: absolute; left: 50%; top: 46%;
  transform-style: preserve-3d;
  will-change: transform;
}
.sg-card {
  position: absolute; left: 0; top: 0;
  width: var(--card-w); height: calc(var(--card-w) * 1.30);
  margin-left: calc(var(--card-w) * -0.5);
  margin-top: calc(var(--card-w) * -0.65);
  transform-style: preserve-3d;
  will-change: transform, opacity, filter;
  background: var(--dark-paper);
  border-radius: 12px;
  outline: 1px solid var(--dark-line);
  outline-offset: -1px;
}
.sg-card img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  -webkit-user-drag: none; user-select: none;
  /* centrifugal warp: scroll velocity tips the photo plane so the corners
     flare outward; scale hides the edges revealed by the tilt */
  transform: perspective(700px) rotateX(var(--warp, 0deg)) scale(1.12);
  will-change: transform;
}
.sg-card { overflow: hidden; }
.sg-card:hover { outline-color: var(--accent); box-shadow: 0 18px 60px rgba(0,0,0,0.55); }
.sg-card .sg-card-no {
  position: absolute; top: 8px; left: 10px;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.85); text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}
.sg-card.is-front { cursor: pointer; }

/* ---- Meta overlay (left) ----------------------------------- */
.sg-meta {
  position: fixed; left: var(--edge); top: 50%; transform: translateY(-50%);
  z-index: 30; pointer-events: none; max-width: 44vw;
}
.sg-meta .m-no {
  font-family: var(--font-mono); font-size: clamp(12px, 1.2vw, 14px);
  letter-spacing: 0.16em; color: var(--accent); display: block;
}
.sg-meta .m-title {
  font-family: var(--font-display); font-weight: 900;
  font-size: clamp(34px, 6.4vw, 110px);
  line-height: 0.92; letter-spacing: -0.02em; text-transform: uppercase;
  margin: 10px 0 14px; color: var(--dark-ink);
  text-wrap: balance;
}
.sg-meta .m-cat {
  display: inline-block;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--dark-soft);
  border: 1px solid var(--dark-line); padding: 6px 12px;
}
.sg-meta .m-no, .sg-meta .m-title, .sg-meta .m-cat {
  transition: opacity 0.28s ease, transform 0.28s var(--ease);
}
.sg-meta.swap .m-no, .sg-meta.swap .m-title, .sg-meta.swap .m-cat {
  opacity: 0; transform: translateY(10px);
  transition: none;
}

/* ---- Hint + scene rail -------------------------------------- */
.sg-hint {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  z-index: 30; font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.22em; color: var(--dark-soft);
  transition: opacity 0.6s ease; pointer-events: none;
}
.sg-hint.gone { opacity: 0; }
.sg-rail {
  position: fixed; right: var(--edge); top: 50%; transform: translateY(-50%);
  z-index: 30; display: flex; flex-direction: column; gap: 14px; text-align: right;
}
.sg-rail a {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; text-decoration: none;
  color: var(--dark-soft); opacity: 0.55;
  transition: opacity 0.25s ease, color 0.25s ease;
}
.sg-rail a.on { opacity: 1; color: var(--accent); }
.sg-rail a:hover { opacity: 1; }

/* ---- Responsive --------------------------------------------- */
:root { --card-w: clamp(150px, 16.5vw, 285px); }
@media (max-width: 700px) {
  .sg-stage { perspective: 900px; }
  .sg-meta { top: auto; bottom: 64px; transform: none; max-width: 80vw; }
  .sg-meta .m-title { font-size: clamp(34px, 11vw, 64px); }
  .sg-rail { display: none; }
  .sg-nav .sg-brand { display: none; }
}

/* ---- Reduced motion: flat list fallback --------------------- */
@media (prefers-reduced-motion: reduce) {
  .sg-stage, .sg-spacer, .sg-hint { display: none; }
  .sg-meta { display: none; }
  .sg-list { display: block !important; padding: 120px var(--edge) 80px; }
  .sg-list figure { margin: 0 0 48px; max-width: 720px; }
  .sg-list img { width: 100%; display: block; }
  .sg-list figcaption {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dark-soft); margin-top: 10px;
  }
}
.sg-list { display: none; }
</style>
</head>
<body class="grain-on" data-screen-label="Full Gallery">

<div class="grain" aria-hidden="true"></div>

<header class="sg-nav">
  <a href="index.html#index" class="sg-back"><span class="arr">←</span>&nbsp; Index</a>
  <a href="index.html" class="sg-brand">T. Naidu<sup>®</sup></a>
  <div class="sg-count"><b id="sgNow">01</b> / <span id="sgTotal">24</span></div>
</header>

<div class="sg-stage" aria-hidden="true">
  <div class="sg-world" id="sgWorld"></div>
</div>

<div class="sg-meta" id="sgMeta" aria-live="polite">
  <span class="m-no" id="sgNo">( 01 )</span>
  <h1 class="m-title" id="sgTitle">Flight</h1>
  <span class="m-cat" id="sgCat">Selected Work</span>
</div>

<nav class="sg-rail" id="sgRail">
  <a href="#" data-cat="Selected Work">Selected</a>
  <a href="#" data-cat="South Africa">South Africa</a>
  <a href="#" data-cat="India">India</a>
  <a href="#" data-cat="Nature">Nature</a>
  <a href="#" data-cat="Street">Street</a>
</nav>

<div class="sg-hint" id="sgHint">( SCROLL )</div>

<div class="sg-spacer" id="sgSpacer"></div>

<!-- Reduced-motion / no-JS fallback list -->
<main class="sg-list" id="sgList"></main>

<script>
(function () {
  "use strict";

  /* Every photograph on the site: src, title, scene, home section */
  const PHOTOS = [
    { src: "work-seagull.jpg",   t: "Flight",           c: "Selected Work", h: "work" },
    { src: "work-sunset.jpg",    t: "Sunset",           c: "Selected Work", h: "work" },
    { src: "work-plane.jpg",     t: "Cruising Altitude",c: "Selected Work", h: "work" },
    { src: "work-excavator.jpg", t: "Red Earth",        c: "Selected Work", h: "work" },
    { src: "work-plant.jpg",     t: "Bloom",            c: "Selected Work", h: "work" },
    { src: "sa-tower.jpg",       t: "The Tower",        c: "South Africa",  h: "south-africa" },
    { src: "sa-sandton.jpg",     t: "Sandton City",     c: "South Africa",  h: "south-africa" },
    { src: "sa-glass.jpg",       t: "Glass & Steel",    c: "South Africa",  h: "south-africa" },
    { src: "sa-madiba.jpg",      t: "Madiba",           c: "South Africa",  h: "south-africa" },
    { src: "sa-fourways.jpg",    t: "Fourways",         c: "South Africa",  h: "south-africa" },
    { src: "ind-minaret.jpg",    t: "Minaret",          c: "India",         h: "india" },
    { src: "ind-charminar.jpg",  t: "Charminar",        c: "India",         h: "india" },
    { src: "ind-secretariat.jpg",t: "Dusk",             c: "India",         h: "india" },
    { src: "ind-bazaar.jpg",     t: "The Bazaar",       c: "India",         h: "india" },
    { src: "ind-pigeons.jpg",    t: "The Keeper",       c: "India",         h: "india" },
    { src: "nat-mist.jpg",       t: "Mist",             c: "Nature",        h: "nature" },
    { src: "nat-clouds.jpg",     t: "Above the Clouds", c: "Nature",        h: "nature" },
    { src: "nat-terraces.jpg",   t: "Terraces",         c: "Nature",        h: "nature" },
    { src: "nat-dragonfly.jpg",  t: "Dragonfly",        c: "Nature",        h: "nature" },
    { src: "str-gridlock.jpg",   t: "Gridlock",         c: "Street",        h: "street" },
    { src: "str-market.jpg",     t: "The Market",       c: "Street",        h: "street" },
    { src: "str-911.jpg",        t: "911",              c: "Street",        h: "street" },
    { src: "str-sunday.jpg",     t: "Sunday Drive",     c: "Street",        h: "street" },
    { src: "str-corner.jpg",     t: "Corner",           c: "Street",        h: "street" }
  ];

  const N = PHOTOS.length;
  const STEP = 360 / 8;             /* 8 frames per revolution → 3 turns,
                                       45° apart so frames never overlap */
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const world  = document.getElementById("sgWorld");
  const meta   = document.getElementById("sgMeta");
  const elNo   = document.getElementById("sgNo");
  const elTitle= document.getElementById("sgTitle");
  const elCat  = document.getElementById("sgCat");
  const elNow  = document.getElementById("sgNow");
  const elTotal= document.getElementById("sgTotal");
  const hint   = document.getElementById("sgHint");
  const rail   = document.getElementById("sgRail");
  const spacer = document.getElementById("sgSpacer");
  const list   = document.getElementById("sgList");

  elTotal.textContent = String(N).padStart(2, "0");

  /* ---- Reduced-motion fallback: plain captioned list ---- */
  if (reduce) {
    PHOTOS.forEach((p, i) => {
      const f = document.createElement("figure");
      const img = document.createElement("img");
      img.src = p.src; img.alt = p.t; img.loading = "lazy";
      const cap = document.createElement("figcaption");
      cap.textContent = String(i + 1).padStart(2, "0") + " — " + p.t + " · " + p.c;
      f.appendChild(img); f.appendChild(cap);
      list.appendChild(f);
    });
    return;
  }

  /* ---- Build the helix ---- */
  const cards = [];
  PHOTOS.forEach((p, i) => {
    const card = document.createElement("a");
    card.className = "sg-card";
    card.href = "index.html#" + p.h;
    card.setAttribute("aria-label", p.t + " — " + p.c);
    const img = document.createElement("img");
    img.src = p.src; img.alt = p.t;
    img.loading = i < 14 ? "eager" : "lazy";
    img.decoding = "async";
    const no = document.createElement("span");
    no.className = "sg-card-no";
    no.textContent = "/ " + String(i + 1).padStart(2, "0");
    card.appendChild(img); card.appendChild(no);
    card.addEventListener("mouseenter", () => { hoverIdx = i; });
    card.addEventListener("mouseleave", () => { if (hoverIdx === i) hoverIdx = -1; });
    world.appendChild(card);
    cards.push(card);
  });

  /* hover pop: eased per-card scale */
  let hoverIdx = -1;
  const pop = new Array(N).fill(0);

  /* ---- Geometry (recomputed on resize) ---- */
  let R = 0, ySpace = 0, perItem = 1;
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    R = Math.max(Math.min(vw * 0.38, 600), 240);          /* spread across view */
    ySpace = Math.max(Math.min(vh * 0.115, 110), 64);      /* dense coil — full helix visible above & below */
    perItem = vh * 0.55;               /* virtual px of input per frame */
  }
  layout();
  window.addEventListener("resize", () => { layout(); });

  /* ---- Infinite virtual scroll: wheel / touch / keys drive an unbounded
     position; the helix wraps modulo N (24 × 45° = 3 exact turns) so you can
     scroll forever in either direction. ---- */
  document.body.classList.add("sg-3d");
  spacer.style.display = "none";
  let f = 0, target = 0, cur = -1, moved = false;

  window.addEventListener("wheel", (e) => {
    target += e.deltaY / perItem;
    moved = true;
  }, { passive: true });

  let touchY = null;
  window.addEventListener("touchstart", (e) => {
    if (e.touches.length) touchY = e.touches[0].clientY;
  }, { passive: true });
  window.addEventListener("touchmove", (e) => {
    if (touchY === null || !e.touches.length) return;
    e.preventDefault();
    const y = e.touches[0].clientY;
    target += (touchY - y) / (perItem * 0.45);   /* finger-tuned ratio */
    touchY = y;
    moved = true;
  }, { passive: false });
  window.addEventListener("touchend", () => { touchY = null; });

  const wrap = (d) => d - N * Math.round(d / N);   /* shortest signed distance */

  /* ---- Cursor parallax: the whole spiral leans subtly toward the mouse ---- */
  let mx = 0, my = 0, pmx = 0, pmy = 0;     /* -0.5..0.5 target / eased */
  window.addEventListener("mousemove", (e) => {
    mx = e.clientX / window.innerWidth  - 0.5;
    my = e.clientY / window.innerHeight - 0.5;
  }, { passive: true });

  /* ---- Scroll → spiral ---- */

  function setMeta(i) {
    if (i === cur) return;
    cur = i;
    const p = PHOTOS[i];
    /* fade out, swap, fade back in */
    meta.classList.add("swap");
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        elNo.textContent = "( " + String(i + 1).padStart(2, "0") + " )";
        elTitle.textContent = p.t;
        elCat.textContent = p.c;
        meta.classList.remove("swap");
      });
    });
    elNow.textContent = String(i + 1).padStart(2, "0");
    /* highlight scene on the rail */
    const links = rail.querySelectorAll("a");
    links.forEach((a) => a.classList.toggle("on", a.dataset.cat === p.c));
  }

  function render(now) {
    requestAnimationFrame(render);
    const vel = (target - f) * 0.085;              /* this frame's motion  */
    f += vel;
    if (Math.abs(target - f) < 0.0004) f = target;

    /* wrapped position 0..N — the infinite loop anchor */
    const fm = ((f % N) + N) % N;

    /* eased cursor parallax */
    pmx += (mx - pmx) * 0.06;
    pmy += (my - pmy) * 0.06;

    /* scroll-velocity distortion — centrifugal: the photo plane inside each
       frame tips with the motion so its corners flare outward, relaxing flat
       when the scroll settles. The helix also leans into the motion. */
    const v = Math.max(-1.6, Math.min(1.6, vel * 10));
    const lean = v * 2.2;
    world.style.setProperty("--warp", (v * -7.5).toFixed(2) + "deg");

    const rot = pmx * 7;                           /* parallax swings the helix */
    world.style.transform =
      "translate(-50%, -50%) rotateX(" + (-3 + pmy * -5 + lean).toFixed(2) + "deg) rotateY(" + rot.toFixed(3) + "deg)";

    for (let i = 0; i < N; i++) {
      const d = wrap(i - fm);                       /* wrapped helix offset */
      const a = (d * STEP + rot) * Math.PI / 180;   /* effective angle      */
      const c = Math.cos(a);                        /* 1 = front, -1 = back */
      const y = d * ySpace;
      /* eased hover pop — frame lifts toward the viewer and grows */
      pop[i] += ((hoverIdx === i ? 1 : 0) - pop[i]) * 0.16;
      const ps = 1 + pop[i] * 0.12;                 /* up to 12% bigger    */
      const pz = pop[i] * 46;                       /* and 46px closer     */
      cards[i].style.transform =
        "translateY(" + y.toFixed(2) + "px) rotateY(" + (d * STEP).toFixed(3) + "deg) translateZ(" + (R + pz).toFixed(1) + "px) scale(" + ps.toFixed(3) + ")";
      /* depth: frames stay clearly visible as they come and go — they darken
         into the background rather than vanishing. Colour drains to B&W as
         frames recede; it floods back in as they approach the front. */
      const vis = Math.max(0, c);
      const colour = Math.pow(vis, 1.6);            /* full colour only near front */
      cards[i].style.opacity = (0.78 + 0.22 * vis).toFixed(3);
      cards[i].style.filter = "brightness(" + (0.58 + 0.48 * vis).toFixed(3) + ") grayscale(" + (1 - colour).toFixed(3) + ")";
      cards[i].style.zIndex = String(Math.round(100 + c * 100));
      cards[i].classList.toggle("is-front", Math.abs(d) < 0.5);
      /* hover pop is available on any frame that's facing the viewer */
      cards[i].style.pointerEvents = c > 0.05 ? "auto" : "none";
    }

    /* the meta text drifts a touch opposite the cursor — subtle parallax */
    meta.style.translate = (pmx * -14).toFixed(1) + "px " + (pmy * -10).toFixed(1) + "px";

    setMeta(((Math.round(fm) % N) + N) % N);
    hint.classList.toggle("gone", moved);
  }
  requestAnimationFrame(render);

  /* ---- Scene rail jumps to a category's first photo (shortest way round) ---- */
  rail.querySelectorAll("a").forEach((a) => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      const i = PHOTOS.findIndex((p) => p.c === a.dataset.cat);
      if (i < 0) return;
      const tm = ((target % N) + N) % N;
      target += wrap(i - tm);
      moved = true;
    });
  });

  /* ---- Keyboard: step one frame ---- */
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "PageDown") {
      e.preventDefault();
      target = Math.round(target) + 1;
      moved = true;
    } else if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      target = Math.round(target) - 1;
      moved = true;
    }
  });
})();
</script>
<script src="app.js"></script>
</body>
</html>
