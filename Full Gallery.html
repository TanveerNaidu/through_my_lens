<!DOCTYPE html>
<html lang="en" data-base="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Full Gallery — Tanveer Naidu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500&family=Anton&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
/* ============================================================
   FULL GALLERY — helix spiral scroll
   Every photograph on the site arranged on a 3D spiral. Scroll
   turns the spiral; the front frame's name + scene fade in on
   the left. Industrial-editorial: warm dark mono + terracotta.
   ============================================================ */
html, body { background: var(--dark-bg); color: var(--dark-ink); }
html { scroll-behavior: auto; }

/* 3D mode (JS adds .sg-3d): virtual infinite scroll — no native scrollbar */
body.sg-3d { overflow: hidden; height: 100svh; }
body.sg-3d .sg-stage { touch-action: none; }

/* faint grid — gives the dark space depth, like graph paper in a studio */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
  background-size: 90px 90px;
}

.sg-nav {
  position: fixed; inset: 0 0 auto 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px var(--edge);
  mix-blend-mode: difference; color: #fff;
}
.sg-nav a { color: #fff; text-decoration: none; }
.sg-back {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
  text-transform: uppercase;
}
.sg-back .arr { display: inline-block; transition: transform 0.25s var(--ease); }
.sg-back:hover .arr { transform: translateX(-4px); }
.sg-brand { font-family: var(--font-display); font-weight: 900; font-size: 15px; letter-spacing: 0.01em; }
.sg-brand sup { font-size: 8px; }
.sg-count {
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
}
.sg-count b { font-weight: 700; }

/* ---- Fixed 3D stage ---------------------------------------- */
.sg-stage {
  position: fixed; inset: 0; overflow: hidden;
  perspective: 1900px; perspective-origin: 50% 46%;
}
.sg-world {
  position: absolute; left: 50%; top: 46%;
  transform-style: preserve-3d;
  will-change: transform;
}
.sg-card {
  position: absolute; left: 0; top: 0;
  width: var(--card-w); height: calc(var(--card-w) * 1.30);
  margin-left: calc(var(--card-w) * -0.5);
  margin-top: calc(var(--card-w) * -0.65);
  transform-style: preserve-3d;
  will-change: transform, opacity, filter;
  background: var(--dark-paper);
  border-radius: 14px;
  overflow: hidden;
  outline: 1px solid var(--dark-line);
  outline-offset: -1px;
}
.sg-card {
  transition: outline-color 0.25s var(--ease), box-shadow 0.3s var(--ease);
}
/* hover ring drawn ABOVE the photo — neutral light edge, no accent colour */
.sg-card::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  border: 1px solid transparent; pointer-events: none; z-index: 3;
  transition: border-color 0.25s var(--ease);
}
.sg-card:hover, .sg-card.is-hover { box-shadow: 0 18px 60px rgba(0,0,0,0.55); }
.sg-card:hover::after, .sg-card.is-hover::after { border-color: rgba(255,255,255,0.55); }
.sg-card img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
  -webkit-user-drag: none; user-select: none;
}
.sg-card-no {
  position: absolute; top: 8px; left: 10px; z-index: 2;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.85); text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}
.sg-card.is-front { cursor: pointer; }

/* ---- Meta overlay (left) ----------------------------------- */
.sg-meta {
  position: fixed; left: var(--edge); top: 50%; transform: translateY(-50%);
  z-index: 30; pointer-events: none; max-width: 44vw;
}
.sg-meta .m-no {
  font-family: var(--font-mono); font-size: clamp(12px, 1.2vw, 14px);
  letter-spacing: 0.16em; color: var(--accent); display: block;
}
.sg-meta .m-title {
  font-family: var(--font-display); font-weight: 900;
  font-size: clamp(34px, 6.4vw, 110px);
  line-height: 0.92; letter-spacing: -0.02em; text-transform: uppercase;
  margin: 10px 0 14px; color: var(--dark-ink);
  text-wrap: balance;
}
.sg-meta .m-cat {
  display: inline-block;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--dark-soft);
  border: 1px solid var(--dark-line); padding: 6px 12px;
}
.sg-meta .m-no, .sg-meta .m-title, .sg-meta .m-cat {
  transition: opacity 0.28s ease, transform 0.28s var(--ease);
}
.sg-meta.swap .m-no, .sg-meta.swap .m-title, .sg-meta.swap .m-cat {
  opacity: 0; transform: translateY(10px);
  transition: none;
}

/* ---- Hint + scene rail -------------------------------------- */
.sg-hint {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  z-index: 30; font-family: var(--font-mono); font-size: 12px;
  letter-spacing: 0.22em; color: var(--dark-soft);
  transition: opacity 0.6s ease; pointer-events: none;
}
.sg-hint.gone { opacity: 0; }
.sg-rail {
  position: fixed; right: var(--edge); top: 50%; transform: translateY(-50%);
  z-index: 30; display: flex; flex-direction: column; gap: 14px; text-align: right;
}
.sg-rail a {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; text-decoration: none;
  color: var(--dark-soft); opacity: 0.55;
  transition: opacity 0.25s ease, color 0.25s ease;
}
.sg-rail a.on { opacity: 1; color: var(--accent); }
.sg-rail a:hover { opacity: 1; }

/* ---- Responsive --------------------------------------------- */
:root { --card-w: clamp(172px, 19vw, 330px); }
@media (max-width: 700px) {
  :root { --card-w: clamp(132px, 42vw, 188px); }
  .sg-stage { perspective: 760px; perspective-origin: 50% 44%; }
  .sg-world { top: 42%; }
  .sg-meta { top: auto; bottom: 52px; transform: none; max-width: 88vw; left: 20px; }
  .sg-meta .m-no { font-size: 11px; }
  .sg-meta .m-title { font-size: clamp(30px, 12vw, 56px); margin: 6px 0 10px; }
  .sg-meta .m-cat { font-size: 10px; padding: 5px 10px; }
  .sg-rail { display: none; }
  .sg-nav { padding: 14px 20px; }
  .sg-nav .sg-brand { display: none; }
  .sg-hint { bottom: 16px; font-size: 10px; letter-spacing: 0.18em; }
  body::before { background-size: 56px 56px; }
}

/* ---- MOBILE: vertical 3D scroll gallery (replaces the helix on phones) --- */
body.sg-scroll { overflow-x: hidden; height: auto; min-height: 100svh; }
body.sg-scroll .sg-stage,
body.sg-scroll .sg-rail { display: none !important; }
/* bottom scrim so the title plate stays legible over passing frames */
body.sg-scroll::after {
  content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 42vh;
  background: linear-gradient(to top,
    var(--dark-bg) 14%,
    color-mix(in oklab, var(--dark-bg) 58%, transparent) 50%,
    transparent);
  z-index: 20; pointer-events: none;
}
.mg-track {
  display: flex; flex-direction: column; align-items: center;
  gap: 7vh; padding: 32vh 0 58vh;
  perspective: 1100px; perspective-origin: 50% 50%;
  position: relative; z-index: 1;
}
.mg-card {
  position: relative; flex: none;
  width: 76vw; max-width: 330px; aspect-ratio: 3 / 4;
  border-radius: 16px; overflow: hidden;
  background: var(--dark-paper);
  outline: 1px solid var(--dark-line); outline-offset: -1px;
  transform-style: preserve-3d;
  will-change: transform, filter, opacity;
  box-shadow: 0 26px 70px rgba(0,0,0,0.55);
  text-decoration: none;
}
.mg-card img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; display: block;
  -webkit-user-drag: none; user-select: none;
}
.mg-card-no {
  position: absolute; top: 10px; left: 12px; z-index: 2;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.85); text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}

/* ---- Reduced motion: flat list fallback --------------------- */
@media (prefers-reduced-motion: reduce) {
  .sg-stage, .sg-spacer, .sg-hint { display: none; }
  .sg-meta { display: none; }
  .sg-list { display: block !important; padding: 120px var(--edge) 80px; }
  .sg-list figure { margin: 0 0 48px; max-width: 720px; }
  .sg-list img { width: 100%; display: block; }
  .sg-list figcaption {
    font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dark-soft); margin-top: 10px;
  }
}
.sg-list { display: none; }
</style>
</head>
<body class="grain-on" data-screen-label="Full Gallery">

<div class="grain" aria-hidden="true"></div>

<header class="sg-nav">
  <a href="index.html#index" class="sg-back"><span class="arr">←</span>&nbsp; Index</a>
  <a href="index.html" class="sg-brand">Through My Lens<sup>®</sup></a>
  <div class="sg-count"><b id="sgNow">01</b> / <span id="sgTotal">24</span></div>
</header>

<div class="sg-stage" aria-hidden="true">
  <div class="sg-world" id="sgWorld"></div>
</div>

<div class="sg-meta" id="sgMeta" aria-live="polite">
  <span class="m-no" id="sgNo">( 01 )</span>
  <h1 class="m-title" id="sgTitle">Flight</h1>
  <span class="m-cat" id="sgCat">Selected Work</span>
</div>

<nav class="sg-rail" id="sgRail">
  <a href="#" data-cat="Selected Work">Selected</a>
  <a href="#" data-cat="South Africa">South Africa</a>
  <a href="#" data-cat="India">India</a>
  <a href="#" data-cat="Nature">Nature</a>
  <a href="#" data-cat="Street">Street</a>
</nav>

<div class="sg-hint" id="sgHint">( SCROLL )</div>

<div class="sg-spacer" id="sgSpacer"></div>

<!-- Reduced-motion / no-JS fallback list -->
<main class="sg-list" id="sgList"></main>

<script>
(function () {
  "use strict";

  /* Every photograph on the site: src, title, scene, home section */
  const PHOTOS = [
    { src: "work-seagull.jpg",   t: "Flight",           c: "Selected Work", h: "work" },
    { src: "work-sunset.jpg",    t: "Sunset",           c: "Selected Work", h: "work" },
    { src: "work-plane.jpg",     t: "Cruising Altitude",c: "Selected Work", h: "work" },
    { src: "work-excavator.jpg", t: "Red Earth",        c: "Selected Work", h: "work" },
    { src: "work-plant.jpg",     t: "Bloom",            c: "Selected Work", h: "work" },
    { src: "sa-tower.jpg",       t: "The Tower",        c: "South Africa",  h: "south-africa" },
    { src: "sa-sandton.jpg",     t: "Sandton City",     c: "South Africa",  h: "south-africa" },
    { src: "sa-glass.jpg",       t: "Glass & Steel",    c: "South Africa",  h: "south-africa" },
    { src: "sa-madiba.jpg",      t: "Madiba",           c: "South Africa",  h: "south-africa" },
    { src: "sa-fourways.jpg",    t: "Fourways",         c: "South Africa",  h: "south-africa" },
    { src: "ind-minaret.jpg",    t: "Minaret",          c: "India",         h: "india" },
    { src: "ind-charminar.jpg",  t: "Charminar",        c: "India",         h: "india" },
    { src: "ind-secretariat.jpg",t: "Dusk",             c: "India",         h: "india" },
    { src: "ind-bazaar.jpg",     t: "The Bazaar",       c: "India",         h: "india" },
    { src: "ind-pigeons.jpg",    t: "The Keeper",       c: "India",         h: "india" },
    { src: "nat-mist.jpg",       t: "Mist",             c: "Nature",        h: "nature" },
    { src: "nat-clouds.jpg",     t: "Above the Clouds", c: "Nature",        h: "nature" },
    { src: "nat-terraces.jpg",   t: "Terraces",         c: "Nature",        h: "nature" },
    { src: "nat-dragonfly.jpg",  t: "Dragonfly",        c: "Nature",        h: "nature" },
    { src: "str-gridlock.jpg",   t: "Gridlock",         c: "Street",        h: "street" },
    { src: "str-market.jpg",     t: "The Market",       c: "Street",        h: "street" },
    { src: "str-911.jpg",        t: "911",              c: "Street",        h: "street" },
    { src: "str-sunday.jpg",     t: "Sunday Drive",     c: "Street",        h: "street" },
    { src: "str-corner.jpg",     t: "Corner",           c: "Street",        h: "street" }
  ];

  const N = PHOTOS.length;
  const STEP = 360 / 8;             /* 8 frames per revolution → 3 turns,
                                       45° apart so frames never overlap */
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const world  = document.getElementById("sgWorld");
  const meta   = document.getElementById("sgMeta");
  const elNo   = document.getElementById("sgNo");
  const elTitle= document.getElementById("sgTitle");
  const elCat  = document.getElementById("sgCat");
  const elNow  = document.getElementById("sgNow");
  const elTotal= document.getElementById("sgTotal");
  const hint   = document.getElementById("sgHint");
  const rail   = document.getElementById("sgRail");
  const spacer = document.getElementById("sgSpacer");
  const list   = document.getElementById("sgList");

  elTotal.textContent = String(N).padStart(2, "0");

  /* ---- Reduced-motion fallback: plain captioned list ---- */
  if (reduce) {
    PHOTOS.forEach((p, i) => {
      const f = document.createElement("figure");
      const img = document.createElement("img");
      img.src = p.src; img.alt = p.t; img.loading = "lazy";
      const cap = document.createElement("figcaption");
      cap.textContent = String(i + 1).padStart(2, "0") + " — " + p.t + " · " + p.c;
      f.appendChild(img); f.appendChild(cap);
      list.appendChild(f);
    });
    return;
  }

  /* ---- MOBILE: vertical 3D scroll gallery -----------------------------
     The helix is a captured/virtual scroll that fights touch devices, so on
     phones we render a real native scroll instead — but keep the spiral's
     essence: frames sit in 3D, grow + flood with colour as they rise to the
     centre, then shrink + drain to black-and-white as they leave. Desktop is
     untouched (this whole branch returns before the helix code runs). ------ */
  if (window.matchMedia("(max-width: 700px)").matches) {
    buildMobileScroll();
    return;
  }

  function buildMobileScroll() {
    document.body.classList.add("sg-scroll");

    const track = document.createElement("div");
    track.className = "mg-track";
    const items = [];
    PHOTOS.forEach((p, i) => {
      const card = document.createElement("a");
      card.className = "mg-card";
      card.href = "index.html#" + p.h;
      card.setAttribute("aria-label", p.t + " — " + p.c);
      const im = document.createElement("img");
      im.src = p.src; im.alt = p.t; im.decoding = "async";
      im.loading = i < 5 ? "eager" : "lazy";
      card.appendChild(im);
      const no = document.createElement("span");
      no.className = "mg-card-no";
      no.textContent = "/ " + String(i + 1).padStart(2, "0");
      card.appendChild(no);
      track.appendChild(card);
      items.push(card);
    });
    document.body.appendChild(track);

    /* document-space centre of each frame — from offset chain so CSS
       transforms (scale/rotate) never pollute the measurement. */
    let centers = [];
    const docTop = (el) => { let t = 0; while (el) { t += el.offsetTop; el = el.offsetParent; } return t; };
    const measure = () => { centers = items.map((el) => docTop(el) + el.offsetHeight / 2); };
    measure();
    window.addEventListener("resize", measure, { passive: true });
    window.addEventListener("load", measure);

    const cT = new Array(items.length).fill("");
    const cF = new Array(items.length).fill("");
    let curIdx = -1, ticking = false;

    function setMetaMobile(i) {
      const p = PHOTOS[i];
      meta.classList.add("swap");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        elNo.textContent = "( " + String(i + 1).padStart(2, "0") + " )";
        elTitle.textContent = p.t;
        elCat.textContent = p.c;
        meta.classList.remove("swap");
      }));
      elNow.textContent = String(i + 1).padStart(2, "0");
    }

    function frame() {
      ticking = false;
      const vh = window.innerHeight;
      const vpC = (window.scrollY || window.pageYOffset) + vh / 2;
      let best = 0, bestAd = Infinity;

      for (let i = 0; i < items.length; i++) {
        const dist = (centers[i] - vpC) / vh;          /* signed: 0 = centred */
        const ad = Math.min(Math.abs(dist), 1.2);
        const adc = Math.min(ad, 1);                    /* clamped for visuals */

        const scale = 1 - adc * 0.34;                   /* big at centre       */
        const tz    = -adc * 130;                       /* recede in depth     */
        const ty    = dist * -26;                       /* gentle pull to centre */
        const rx    = Math.max(-24, Math.min(24, dist * 22));   /* 3D tilt     */
        const ry    = Math.max(-15, Math.min(15, dist * -12));  /* helical twist */

        const t = "translateY(" + ty.toFixed(1) + "px) translateZ(" + tz.toFixed(1) +
          "px) rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) +
          "deg) scale(" + scale.toFixed(3) + ")";
        if (t !== cT[i]) { items[i].style.transform = t; cT[i] = t; }

        /* black-and-white as frames come and go; colour at the centre */
        const f2 = "brightness(" + (1 - adc * 0.5).toFixed(2) + ") grayscale(" + adc.toFixed(2) + ")";
        if (f2 !== cF[i]) { items[i].style.filter = f2; cF[i] = f2; }
        items[i].style.opacity = (1 - adc * 0.42).toFixed(2);
        items[i].style.zIndex = String(Math.round(100 - adc * 100));

        if (ad < bestAd) { bestAd = ad; best = i; }
      }

      if (best !== curIdx) { curIdx = best; setMetaMobile(best); }
      hint.classList.toggle("gone", (window.scrollY || window.pageYOffset) > 40);
    }

    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } };
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
    requestAnimationFrame(frame);
  }

  /* ---- Build the helix ---- */
  const cards = [];
  PHOTOS.forEach((p, i) => {
    const card = document.createElement("a");
    card.className = "sg-card";
    card.href = "index.html#" + p.h;
    card.setAttribute("aria-label", p.t + " — " + p.c);
    const im = document.createElement("img");
    im.src = p.src; im.alt = p.t;
    im.loading = i < 14 ? "eager" : "lazy";
    im.decoding = "async";
    card.appendChild(im);
    const no = document.createElement("span");
    no.className = "sg-card-no";
    no.textContent = "/ " + String(i + 1).padStart(2, "0");
    card.appendChild(no);
    card.addEventListener("mouseenter", () => { hoverIdx = i; });
    card.addEventListener("mouseleave", () => { if (hoverIdx === i) hoverIdx = -1; });
    world.appendChild(card);
    cards.push(card);
  });

  /* hover pop: eased per-card scale */
  let hoverIdx = -1;
  const pop = new Array(N).fill(0);

  /* ---- Geometry (recomputed on resize) ---- */
  let R = 0, ySpace = 0, perItem = 1, mobile = false;
  function layout() {
    const vw = window.innerWidth, vh = window.innerHeight;
    mobile = vw <= 700;
    if (mobile) {
      /* tighter radius so frames stay fully on-screen on a narrow phone */
      R = Math.max(Math.min(vw * 0.30, 220), 110);
      ySpace = Math.max(Math.min(vh * 0.095, 92), 54);
    } else {
      R = Math.max(Math.min(vw * 0.38, 600), 240);        /* spread across view */
      ySpace = Math.max(Math.min(vh * 0.115, 110), 64);   /* dense coil — full helix visible above & below */
    }
    perItem = vh * 0.55;               /* virtual px of input per frame */
  }
  layout();
  let forceDraw = true;   /* request one full draw pass (init / resize) */
  window.addEventListener("resize", () => { layout(); forceDraw = true; });

  /* ---- Infinite virtual scroll: wheel / touch / keys drive an unbounded
     position; the helix wraps modulo N (24 × 45° = 3 exact turns) so you can
     scroll forever in either direction. ---- */
  document.body.classList.add("sg-3d");
  spacer.style.display = "none";
  let f = 0, target = 0, cur = -1, moved = false;

  /* ---- Idle auto-drift: when the user isn't actively scrolling, the spiral
     turns on its own, very slowly. Any input resets the idle timer. ---- */
  const IDLE_MS    = 1400;     /* wait this long after last input before drifting */
  const AUTO_SPEED = 0.0014;   /* frames advanced per animation frame (~1 frame / 12s) */
  let lastInput = performance.now();
  const noteInput = () => { lastInput = performance.now(); };

  window.addEventListener("wheel", (e) => {
    target += e.deltaY / perItem;
    moved = true;
    noteInput();
  }, { passive: true });

  let touchY = null;
  window.addEventListener("touchstart", (e) => {
    if (e.touches.length) touchY = e.touches[0].clientY;
    noteInput();
  }, { passive: true });
  window.addEventListener("touchmove", (e) => {
    if (touchY === null || !e.touches.length) return;
    e.preventDefault();
    const y = e.touches[0].clientY;
    target += (touchY - y) / (perItem * 0.45);   /* finger-tuned ratio */
    touchY = y;
    moved = true;
    noteInput();
  }, { passive: false });
  window.addEventListener("touchend", () => { touchY = null; noteInput(); });

  const wrap = (d) => d - N * Math.round(d / N);   /* shortest signed distance */

  /* ---- Cursor parallax: the whole spiral leans subtly toward the mouse ---- */
  let mx = 0, my = 0, pmx = 0, pmy = 0;     /* -0.5..0.5 target / eased */
  window.addEventListener("mousemove", (e) => {
    mx = e.clientX / window.innerWidth  - 0.5;
    my = e.clientY / window.innerHeight - 0.5;
  }, { passive: true });

  /* ---- Scroll → spiral ---- */

  /* Per-element write caches — we only touch the DOM when a value actually
     changes. This is the core smoothness fix: when the spiral is settled the
     loop produces identical strings and performs ZERO style writes, so the
     browser does no recalc/paint. During motion, values are quantized so the
     (expensive) grayscale filter repaints in coarse steps, not every frame. */
  const cT = new Array(N).fill("");
  const cO = new Array(N).fill("");
  const cF = new Array(N).fill("");
  const cZ = new Array(N).fill(0);
  const cPE = new Array(N).fill("");
  const cFront = new Array(N).fill(false);
  const cHover = new Array(N).fill(false);
  let cWorld = "", cMeta = "";
  const q = (v, s) => Math.round(v / s) * s;   /* quantize to step s */

  function setMeta(i) {
    if (i === cur) return;
    cur = i;
    const p = PHOTOS[i];
    /* fade out, swap, fade back in */
    meta.classList.add("swap");
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        elNo.textContent = "( " + String(i + 1).padStart(2, "0") + " )";
        elTitle.textContent = p.t;
        elCat.textContent = p.c;
        meta.classList.remove("swap");
      });
    });
    elNow.textContent = String(i + 1).padStart(2, "0");
    /* highlight scene on the rail */
    const links = rail.querySelectorAll("a");
    links.forEach((a) => a.classList.toggle("on", a.dataset.cat === p.c));
  }

  function render(now) {
    requestAnimationFrame(render);

    /* idle → drift the spiral forward at a slow, constant crawl */
    if (now - lastInput > IDLE_MS) target += AUTO_SPEED;

    const vel = (target - f) * 0.085;              /* this frame's motion  */
    f += vel;
    if (Math.abs(target - f) < 0.0004) f = target;

    /* eased cursor parallax — snap to target once it's imperceptibly close so
       the loop can fully settle (otherwise it animates forever by a hair). */
    pmx += (mx - pmx) * 0.06;
    pmy += (my - pmy) * 0.06;
    if (Math.abs(mx - pmx) < 0.0005) pmx = mx;
    if (Math.abs(my - pmy) < 0.0005) pmy = my;

    /* hover pops ease toward 0/1; track whether any are still moving */
    let popActive = false;
    for (let i = 0; i < N; i++) {
      const tgt = hoverIdx === i ? 1 : 0;
      pop[i] += (tgt - pop[i]) * 0.16;
      if (Math.abs(tgt - pop[i]) < 0.002) pop[i] = tgt;
      else popActive = true;
    }

    /* Nothing moving? Skip the entire per-card pass — no compute, no DOM
       writes, no paint. This is what keeps it buttery when settled or idle. */
    const moving = (f !== target) || (pmx !== mx) || (pmy !== my) || popActive;
    if (!moving && !forceDraw) { hint.classList.toggle("gone", moved); return; }
    forceDraw = false;

    /* wrapped position 0..N — the infinite loop anchor */
    const fm = ((f % N) + N) % N;

    /* scroll-velocity distortion — the helix leans into the motion, relaxing
       flat when the scroll settles. */
    const v = Math.max(-1.6, Math.min(1.6, vel * 10));
    const lean = v * 2.2;
    const rot = pmx * 7;                           /* parallax swings the helix */

    const wt =
      "translate(-50%, -50%) rotateX(" + (-3 + pmy * -5 + lean).toFixed(2) + "deg) rotateY(" + rot.toFixed(3) + "deg)";
    if (wt !== cWorld) { world.style.transform = wt; cWorld = wt; }

    for (let i = 0; i < N; i++) {
      const d = wrap(i - fm);                       /* wrapped helix offset */
      const a = (d * STEP + rot) * Math.PI / 180;   /* effective angle      */
      const c = Math.cos(a);                        /* 1 = front, -1 = back */
      const y = d * ySpace;
      /* MOBILE ONLY: scale by depth so the centre frame is large and frames
         shrink as they enter/leave — kills the same-size overlap pile-up.
         PC keeps mScale = 1, so its geometry is byte-for-byte unchanged. */
      const frontness = (c + 1) / 2;               /* 0 = back, 1 = front */
      const mScale = mobile ? (0.42 + 0.58 * frontness) : 1;
      const ps = (1 + pop[i] * 0.12) * mScale;     /* up to 12% hover bump */
      const pz = pop[i] * 46;                       /* and 46px closer     */

      const t =
        "translateY(" + y.toFixed(1) + "px) rotateY(" + (d * STEP).toFixed(2) + "deg) translateZ(" + (R + pz).toFixed(1) + "px) scale(" + ps.toFixed(3) + ")";
      if (t !== cT[i]) { cards[i].style.transform = t; cT[i] = t; }

      /* depth: frames darken + drain to B&W as they recede, colour floods back
         near the front. Quantized so this (expensive) filter only repaints in
         coarse steps instead of on every single frame. */
      const vis = Math.max(0, c);
      const colour = Math.pow(vis, 1.6);
      const o = q(0.78 + 0.22 * vis, 0.02).toFixed(2);
      if (o !== cO[i]) { cards[i].style.opacity = o; cO[i] = o; }
      const fl = "brightness(" + q(0.58 + 0.48 * vis, 0.04).toFixed(2) + ") grayscale(" + q(1 - colour, 0.05).toFixed(2) + ")";
      if (fl !== cF[i]) { cards[i].style.filter = fl; cF[i] = fl; }

      const z = Math.round(100 + c * 100);
      if (z !== cZ[i]) { cards[i].style.zIndex = String(z); cZ[i] = z; }

      const front = Math.abs(d) < 0.5;
      if (front !== cFront[i]) { cards[i].classList.toggle("is-front", front); cFront[i] = front; }
      const hov = hoverIdx === i && c > 0.05;
      if (hov !== cHover[i]) { cards[i].classList.toggle("is-hover", hov); cHover[i] = hov; }
      const pe = c > 0.05 ? "auto" : "none";
      if (pe !== cPE[i]) { cards[i].style.pointerEvents = pe; cPE[i] = pe; }
    }

    /* the meta text drifts a touch opposite the cursor — subtle parallax */
    const mt = (pmx * -14).toFixed(1) + "px " + (pmy * -10).toFixed(1) + "px";
    if (mt !== cMeta) { meta.style.translate = mt; cMeta = mt; }

    setMeta(((Math.round(fm) % N) + N) % N);
    hint.classList.toggle("gone", moved);
  }
  requestAnimationFrame(render);

  /* ---- Scene rail jumps to a category's first photo (shortest way round) ---- */
  rail.querySelectorAll("a").forEach((a) => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      const i = PHOTOS.findIndex((p) => p.c === a.dataset.cat);
      if (i < 0) return;
      const tm = ((target % N) + N) % N;
      target += wrap(i - tm);
      moved = true;
      noteInput();
    });
  });

  /* ---- Keyboard: step one frame ---- */
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "PageDown") {
      e.preventDefault();
      target = Math.round(target) + 1;
      moved = true;
      noteInput();
    } else if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "PageUp") {
      e.preventDefault();
      target = Math.round(target) - 1;
      moved = true;
      noteInput();
    }
  });
})();
</script>
<script src="app.js"></script>
</body>
</html>
